<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Era animated profile</title>
  <desc id="desc">Animated profile information shown one block at a time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070a0f"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#f89820" stop-opacity=".22"/><stop offset="1" stop-color="#f89820" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <ellipse cx="1000" cy="100" rx="300" ry="220" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="1000;820;1000" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;320;100" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="#f89820" opacity=".16">
    <path d="M-50 330C180 80 370 450 630 180S1030 20 1250 160">
      <animate attributeName="d" values="M-50 330C180 80 370 450 630 180S1030 20 1250 160;M-50 220C180 420 370 0 630 240S1030 390 1250 100;M-50 330C180 80 370 450 630 180S1030 20 1250 160" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g fill="#f4f7fb">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.21;.25;1" dur="20s" repeatCount="indefinite"/>
        <text x="92" y="82" fill="#718198" font-size="14">era.profile / intro</text>
        <text x="92" y="145" font-size="34" font-weight="700"># Hi, I'm Era 👋</text>
        <text x="92" y="195" font-size="22" fill="#d2dbea">Programming Technologies student at INAI</text>
        <text x="92" y="238" font-size="22" fill="#d2dbea">Aspiring Full-Stack Developer</text>
        <text x="92" y="295" font-size="18">I'm passionate about software development and enjoy learning new technologies,</text>
        <text x="92" y="326" font-size="18">building projects, and improving my programming skills.</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.24;.28;.46;.50;1" dur="20s" repeatCount="indefinite"/>
        <text x="92" y="82" fill="#718198" font-size="14">era.profile / stack</text>
        <text x="92" y="145" font-size="28" fill="#f89820">## Tech Stack</text>
        <text x="92" y="202" font-size="22">☕ Java</text>
        <text x="92" y="242" font-size="22">🐍 Python</text>
        <text x="92" y="282" font-size="22">🐘 PostgreSQL</text>
        <text x="92" y="322" font-size="22">🐙 Git &amp; GitHub</text>
        <text x="92" y="362" font-size="22">🌐 JS</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.53;.70;.74;1" dur="20s" repeatCount="indefinite"/>
        <text x="92" y="82" fill="#718198" font-size="14">era.profile / learning</text>
        <text x="92" y="145" font-size="28" fill="#f89820">## Currently Learning</text>
        <text x="92" y="205" font-size="22">- Java Core</text>
        <text x="92" y="250" font-size="22">- Object-Oriented Programming</text>
        <text x="92" y="295" font-size="22">- SQL &amp; PostgreSQL</text>
        <text x="92" y="340" font-size="22">- Backend Development</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.73;.77;.96;1;1" dur="20s" repeatCount="indefinite"/>
        <text x="92" y="82" fill="#718198" font-size="14">era.profile / goals</text>
        <text x="92" y="145" font-size="28" fill="#f89820">## Projects</text>
        <text x="92" y="202" font-size="22">I build educational and personal projects</text>
        <text x="92" y="242" font-size="22">to practice programming and explore</text>
        <text x="92" y="282" font-size="22">new technologies.</text>
        <text x="92" y="342" font-size="22" fill="#f89820">## Goals</text>
        <text x="92" y="382" font-size="18">Become a strong Java Backend Developer and grow as a software engineer.</text>
      </g>
    </g>
    <rect x="1060" y="370" width="11" height="25" rx="2" fill="#f89820">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
