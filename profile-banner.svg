<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Era profile animation</title>
  <desc id="desc">Four profile modules appear one after another, with sentences revealed sequentially.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070c"/><stop offset=".55" stop-color="#101827"/><stop offset="1" stop-color="#17100b"/></linearGradient>
    <radialGradient id="amber"><stop stop-color="#f89820" stop-opacity=".28"/><stop offset="1" stop-color="#f89820" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#4f8dcc" stop-opacity=".18"/><stop offset="1" stop-color="#4f8dcc" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <ellipse cx="990" cy="80" rx="310" ry="220" fill="url(#amber)" filter="url(#blur)"><animate attributeName="cx" values="990;780;990" dur="14s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="170" cy="350" rx="280" ry="180" fill="url(#blue)" filter="url(#blur)"><animate attributeName="cx" values="170;400;170" dur="16s" repeatCount="indefinite"/></ellipse>
  <g fill="none" stroke="#f89820" opacity=".16"><ellipse cx="820" cy="210" rx="410" ry="125"><animateTransform attributeName="transform" type="rotate" values="0 820 210;12 820 210;0 820 210" dur="18s" repeatCount="indefinite"/></ellipse></g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#f4f7fb">
    <g>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.02;.22;.25" dur="20s" repeatCount="indefinite"/>
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / intro</text>
      <text x="92" y="140" font-size="32" font-weight="700" opacity="0"><animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.02;.99;1" dur="20s" repeatCount="indefinite"/># Hi, I'm Era 👋</text>
      <text x="92" y="190" font-size="21" fill="#d2dbea" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.06;.09;1" dur="20s" repeatCount="indefinite"/>Programming Technologies student at INAI</text>
      <text x="92" y="232" font-size="21" fill="#d2dbea" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.11;.14;1" dur="20s" repeatCount="indefinite"/>Aspiring Full-Stack Developer</text>
      <text x="92" y="282" font-size="17" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.16;.19;1" dur="20s" repeatCount="indefinite"/>I'm passionate about software development and enjoy learning new technologies,</text>
      <text x="92" y="310" font-size="17" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.19;.22;1" dur="20s" repeatCount="indefinite"/>building projects, and improving my programming skills.</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.24;.27;.47;.50" dur="20s" repeatCount="indefinite"/>
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / stack</text>
      <text x="92" y="145" font-size="28" fill="#f89820">## Tech Stack</text>
      <text x="92" y="205" font-size="22" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;.27;1" dur="20s" repeatCount="indefinite"/>☕ Java</text>
      <text x="92" y="245" font-size="22" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;.30;1" dur="20s" repeatCount="indefinite"/>🐍 Python</text>
      <text x="92" y="285" font-size="22" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;.33;1" dur="20s" repeatCount="indefinite"/>🐘 PostgreSQL</text>
      <text x="92" y="325" font-size="22" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;.36;1" dur="20s" repeatCount="indefinite"/>🐙 Git &amp; GitHub</text>
      <text x="92" y="365" font-size="22" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;.39;1" dur="20s" repeatCount="indefinite"/>🌐 JS</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.49;.52;.72;.75" dur="20s" repeatCount="indefinite"/>
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / learning</text><text x="92" y="145" font-size="28" fill="#f89820">## Currently Learning</text>
      <text x="92" y="205" font-size="22">- Java Core</text><text x="92" y="250" font-size="22">- Object-Oriented Programming</text><text x="92" y="295" font-size="22">- SQL &amp; PostgreSQL</text><text x="92" y="340" font-size="22">- Backend Development</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.77;.97;1" dur="20s" repeatCount="indefinite"/>
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / projects &amp; goals</text><text x="92" y="145" font-size="28" fill="#f89820">## Projects</text>
      <text x="92" y="205" font-size="22">I build educational and personal projects</text><text x="92" y="250" font-size="22">to practice programming and explore new technologies.</text>
      <text x="92" y="320" font-size="28" fill="#f89820">## Goals</text><text x="92" y="370" font-size="20">Become a strong Java Backend Developer.</text>
    </g>
  </g>
  <rect x="92" y="335" width="10" height="25" rx="2" fill="#f89820">
    <animate attributeName="x" values="92;700;92;500;92;650;92;850;92" keyTimes="0;.22;.25;.47;.50;.72;.75;.97;1" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1;0;0;1" keyTimes="0;.22;.25;.47;.50;.72;.75;.97;1" dur="20s" repeatCount="indefinite"/>
  </rect>
</svg>
