<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Era animated profile introduction</title>
  <desc id="desc">Animated introduction for Era, a Programming Technologies student and aspiring Full-Stack Developer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset=".52" stop-color="#111827"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f89820" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f89820" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="line1"><rect x="92" y="105" width="0" height="42"><animate attributeName="width" values="0;445;445;0" keyTimes="0;.22;.76;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="92" y="163" width="0" height="30"><animate attributeName="width" values="0;575;575;0" keyTimes="0;.22;.76;1" dur="16s" begin=".25s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="92" y="207" width="0" height="30"><animate attributeName="width" values="0;600;600;0" keyTimes="0;.22;.76;1" dur="16s" begin=".5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line4"><rect x="92" y="251" width="0" height="30"><animate attributeName="width" values="0;950;950;0" keyTimes="0;.22;.76;1" dur="16s" begin=".75s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line5"><rect x="92" y="295" width="0" height="30"><animate attributeName="width" values="0;730;730;0" keyTimes="0;.22;.76;1" dur="16s" begin="1s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <ellipse cx="1080" cy="35" rx="280" ry="190" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="1080;880;1080" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="35;300;35" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="none" stroke="#f89820" opacity=".18">
    <path d="M-50 300C180 70 370 410 620 175S1020 20 1250 155">
      <animate attributeName="d" values="M-50 300C180 70 370 410 620 175S1020 20 1250 155;M-50 210C180 390 370 0 620 220S1020 380 1250 100;M-50 300C180 70 370 410 620 175S1020 20 1250 155" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M-40 80C220 310 430 -10 700 155S1040 350 1240 45" stroke="#9fb7d8">
      <animate attributeName="d" values="M-40 80C220 310 430 -10 700 155S1040 350 1240 45;M-40 145C220 -10 430 360 700 90S1040 -30 1240 285;M-40 80C220 310 430 -10 700 155S1040 350 1240 45" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="92" y="70" fill="#718198" font-size="14">era.profile</text>
    <circle cx="1035" cy="64" r="4" fill="#28c840">
      <animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g fill="#f4f7fb">
      <text x="92" y="140" font-size="34" font-weight="700" clip-path="url(#line1)">Hi, I'm Era 👋</text>
      <text x="92" y="187" font-size="22" fill="#d2dbea" clip-path="url(#line2)">Programming Technologies student at INAI</text>
      <text x="92" y="231" font-size="22" fill="#d2dbea" clip-path="url(#line3)">Aspiring Full-Stack Developer</text>
      <text x="92" y="275" font-size="18" fill="#c4cfdf" clip-path="url(#line4)">I'm passionate about software development and enjoy learning new technologies.</text>
      <text x="92" y="319" font-size="18" fill="url(#accent)" clip-path="url(#line5)">Always learning. Always building.</text>
    </g>
    <rect x="835" y="300" width="11" height="25" rx="2" fill="#f89820">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
