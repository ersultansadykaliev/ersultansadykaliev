<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Era — aspiring Java developer</title>
  <desc id="desc">Animated terminal-style introduction for Era, a Programming Technologies student and aspiring Java developer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="1" stop-color="#ffca63"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="line1"><rect x="104" y="119" width="0" height="34"><animate attributeName="width" values="0;410;410;0" keyTimes="0;0.22;0.76;1" dur="16s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="104" y="168" width="0" height="30"><animate attributeName="width" values="0;620;620;0" keyTimes="0;0.22;0.76;1" dur="16s" begin="0.35s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="104" y="214" width="0" height="30"><animate attributeName="width" values="0;450;450;0" keyTimes="0;0.22;0.76;1" dur="16s" begin="0.7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line4"><rect x="104" y="260" width="0" height="30"><animate attributeName="width" values="0;570;570;0" keyTimes="0;0.22;0.76;1" dur="16s" begin="1.05s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#293548" stroke-width="2"/>
  <circle cx="1040" cy="80" r="115" fill="#f89820" opacity="0.08" filter="url(#softGlow)"/>
  <path d="M0 312H1200" stroke="#253044" opacity="0.7"/>

  <g fill="#9aa8bc" opacity="0.25" font-family="monospace" font-size="22">
    <text x="900" y="72">&lt;/&gt;</text>
    <text x="1065" y="155">;</text>
    <text x="815" y="285">{ }</text>
    <text x="1010" y="315">()</text>
    <text x="695" y="82">01</text>
    <text x="1140" y="245">#</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="6s" repeatCount="indefinite"/>
      <text x="900" y="72">&lt;/&gt;</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 12 8; 0 0" dur="8s" begin="-2s" repeatCount="indefinite"/>
      <text x="815" y="285">{ }</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="64" y="42" width="1072" height="32" rx="8" fill="#0d131d" stroke="#263244"/>
    <circle cx="84" cy="58" r="5" fill="#ff5f57"/>
    <circle cx="102" cy="58" r="5" fill="#febc2e"/>
    <circle cx="120" cy="58" r="5" fill="#28c840"/>
    <text x="144" y="63" fill="#728198" font-size="13">era@inai: ~/profile</text>
    <text x="82" y="104" fill="#f89820" font-size="17">$</text>
    <text x="104" y="104" fill="#a9b7ca" font-size="16">cat about-era.txt</text>

    <g fill="#f4f7fb">
      <text x="104" y="145" font-size="30" font-weight="700" clip-path="url(#line1)">Hi, I'm Era 👋</text>
      <text x="104" y="191" font-size="21" clip-path="url(#line2)" fill="#d2dbea">Programming Technologies Student</text>
      <text x="104" y="237" font-size="21" clip-path="url(#line3)" fill="#d2dbea">☕ Aspiring Java Developer</text>
      <text x="104" y="283" font-size="21" clip-path="url(#line4)" fill="url(#accent)">🗄️ Java • PostgreSQL • Git</text>
    </g>

    <rect x="692" y="263" width="12" height="25" rx="2" fill="#f89820">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="104" y="326" fill="#63728a" font-size="13">building reliable backends, one commit at a time</text>
    <circle cx="1110" cy="326" r="4" fill="#28c840">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
