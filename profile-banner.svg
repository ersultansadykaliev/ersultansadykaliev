<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Era animated profile introduction</title>
  <desc id="desc">Animated profile text for Era, a Programming Technologies student and aspiring Full-Stack Developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop stop-color="#f89820"/><stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#f89820" stop-opacity=".2"/><stop offset="1" stop-color="#f89820" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="typing"><rect x="92" y="108" width="0" height="260"><animate attributeName="width" values="0;1010;1010;0" keyTimes="0;.24;.78;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <ellipse cx="1030" cy="55" rx="300" ry="210" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="1030;850;1030" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;350;55" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="#f89820" opacity=".18">
    <path d="M-50 340C180 80 370 450 630 180S1030 20 1250 160">
      <animate attributeName="d" values="M-50 340C180 80 370 450 630 180S1030 20 1250 160;M-50 230C180 420 370 0 630 240S1030 390 1250 100;M-50 340C180 80 370 450 630 180S1030 20 1250 160" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M-40 90C220 320 430 -10 710 160S1040 350 1240 45" stroke="#a7bad6">
      <animate attributeName="d" values="M-40 90C220 320 430 -10 710 160S1040 350 1240 45;M-40 155C220 -10 430 370 710 95S1040 -30 1240 300;M-40 90C220 320 430 -10 710 160S1040 350 1240 45" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#f4f7fb" clip-path="url(#typing)">
    <text x="92" y="58" fill="#718198" font-size="14">era.profile</text>
    <text x="92" y="112" font-size="32" font-weight="700"># Hi, I'm Era 👋</text>
    <text x="92" y="151" font-size="20" fill="#d2dbea">Programming Technologies student at INAI</text>
    <text x="92" y="187" font-size="20" fill="#d2dbea">Aspiring Full-Stack Developer</text>
    <text x="92" y="233" font-size="17">I'm passionate about software development and enjoy learning new technologies,</text>
    <text x="92" y="260" font-size="17">building projects, and improving my programming skills.</text>
    <text x="92" y="308" font-size="19" fill="url(#orange)">## Tech Stack</text>
    <text x="92" y="337" font-size="16">☕ Java   ·   🐍 Python   ·   🐘 PostgreSQL</text>
    <text x="92" y="363" font-size="16">🐙 Git &amp; GitHub   ·   🌐 JS</text>
    <text x="92" y="407" font-size="18" fill="url(#orange)">Always learning. Always building.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#f4f7fb">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.22;.28;.70;.78;1" dur="20s" repeatCount="indefinite"/>
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / learning</text>
      <text x="92" y="142" font-size="24" fill="url(#orange)">## Currently Learning</text>
      <text x="92" y="190" font-size="20">- Java Core</text>
      <text x="92" y="230" font-size="20">- Object-Oriented Programming</text>
      <text x="92" y="270" font-size="20">- SQL &amp; PostgreSQL</text>
      <text x="92" y="310" font-size="20">- Backend Development</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.48;.54;.70;.78;1" dur="20s" repeatCount="indefinite"/>
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / projects</text>
      <text x="92" y="142" font-size="24" fill="url(#orange)">## Projects</text>
      <text x="92" y="195" font-size="20">I build educational and personal projects</text>
      <text x="92" y="235" font-size="20">to practice programming and explore</text>
      <text x="92" y="275" font-size="20">new technologies.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.68;.74;.94;1;1" dur="20s" repeatCount="indefinite"/>
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / goals</text>
      <text x="92" y="142" font-size="24" fill="url(#orange)">## Goals</text>
      <text x="92" y="195" font-size="20">Become a strong Java Backend Developer</text>
      <text x="92" y="235" font-size="20">and continuously grow as a software engineer.</text>
      <text x="92" y="300" font-size="18" fill="url(#orange)">---  Always learning. Always building.</text>
    </g>
    <rect x="1045" y="378" width="11" height="25" rx="2" fill="#f89820">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
