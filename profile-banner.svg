<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Animated abstract background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="0.5" stop-color="#101827"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f89820" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f89820" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse cx="190" cy="50" rx="220" ry="170" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="190;420;190" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;290;50" dur="15s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1030" cy="300" rx="250" ry="190" fill="url(#glow)" opacity=".65" filter="url(#blur)">
    <animate attributeName="cx" values="1030;820;1030" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;70;300" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="none" stroke="#f89820" stroke-width="1.5" opacity=".28">
    <path d="M-80 270 C180 40 390 420 650 175 S1040 30 1280 150">
      <animate attributeName="d" values="M-80 270 C180 40 390 420 650 175 S1040 30 1280 150;M-80 215 C180 380 390 0 650 220 S1040 390 1280 120;M-80 270 C180 40 390 420 650 175 S1040 30 1280 150" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M-50 95 C230 310 420 -20 710 155 S1050 350 1250 50" stroke="#82a8d8" opacity=".3">
      <animate attributeName="d" values="M-50 95 C230 310 420 -20 710 155 S1050 350 1250 50;M-50 150 C230 -10 420 350 710 90 S1050 -30 1250 290;M-50 95 C230 310 420 -20 710 155 S1050 350 1250 50" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#f89820" filter="url(#smallBlur)">
    <circle cx="110" cy="290" r="3"><animate attributeName="cy" values="290;45;290" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="90" r="2"><animate attributeName="cx" values="360;530;360" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="300" r="3"><animate attributeName="cy" values="300;70;300" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="100" r="2"><animate attributeName="cx" values="980;760;980" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values=".15;1;.15" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="260" r="3"><animate attributeName="cy" values="260;40;260" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="none" stroke="#b9c9df" stroke-width="1" opacity=".18">
    <circle cx="600" cy="180" r="90">
      <animate attributeName="r" values="90;145;90" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".18;0;.18" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="180" r="90">
      <animate attributeName="r" values="90;145;90" dur="10s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".18;0;.18" dur="10s" begin="-5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
