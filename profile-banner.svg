<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Era sequential typing profile animation</title>
  <desc id="desc">Five profile sections typed one after another with a moving terminal cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#05070c"/><stop offset=".45" stop-color="#101827"/><stop offset="1" stop-color="#16100b"/>
    </linearGradient>
    <radialGradient id="amber"><stop stop-color="#f89820" stop-opacity=".3"/><stop offset="1" stop-color="#f89820" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#4f8dcc" stop-opacity=".2"/><stop offset="1" stop-color="#4f8dcc" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="introClip"><rect x="92" y="64" width="0" height="280"><animate attributeName="width" values="0;980;980;0" keyTimes="0;.2;.27;.32" dur="25s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="stackClip"><rect x="92" y="64" width="0" height="300"><animate attributeName="width" values="0;450;450;0" keyTimes="0;.2;.27;.32" dur="25s" begin="6.25s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="learnClip"><rect x="92" y="64" width="0" height="300"><animate attributeName="width" values="0;650;650;0" keyTimes="0;.2;.27;.32" dur="25s" begin="10.5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="projectsClip"><rect x="92" y="64" width="0" height="300"><animate attributeName="width" values="0;620;620;0" keyTimes="0;.2;.27;.32" dur="25s" begin="14.75s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="goalsClip"><rect x="92" y="64" width="0" height="300"><animate attributeName="width" values="0;850;850;0" keyTimes="0;.2;.27;.32" dur="25s" begin="19s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <ellipse cx="970" cy="70" rx="330" ry="230" fill="url(#amber)" filter="url(#blur)">
    <animate attributeName="cx" values="970;760;970" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;350;70" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="180" cy="360" rx="280" ry="190" fill="url(#blue)" filter="url(#blur)">
    <animate attributeName="cx" values="180;420;180" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke-width="1">
    <ellipse cx="820" cy="205" rx="410" ry="125" stroke="#f89820" opacity=".16">
      <animateTransform attributeName="transform" type="rotate" values="0 820 205;8 820 205;0 820 205" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="820" cy="205" rx="410" ry="125" stroke="#7fa9d5" opacity=".15" transform="rotate(60 820 205)">
      <animateTransform attributeName="transform" type="rotate" values="60 820 205;48 820 205;60 820 205" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g fill="#f89820">
    <circle cx="190" cy="70" r="2"><animate attributeName="cy" values="70;330;70" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="330" r="3"><animate attributeName="cx" values="1030;830;1030" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="55" r="2"><animate attributeName="cy" values="55;290;55" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="8s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#f4f7fb">
    <g clip-path="url(#introClip)">
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / intro</text>
      <text x="92" y="137" font-size="32" font-weight="700"># Hi, I'm Era 👋</text>
      <text x="92" y="180" font-size="20" fill="#d2dbea">Programming Technologies student at INAI</text>
      <text x="92" y="220" font-size="20" fill="#d2dbea">Aspiring Full-Stack Developer</text>
      <text x="92" y="270" font-size="17">I'm passionate about software development and enjoy learning new technologies,</text>
      <text x="92" y="298" font-size="17">building projects, and improving my programming skills.</text>
    </g>
    <g clip-path="url(#stackClip)">
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / stack</text>
      <text x="92" y="145" font-size="28" fill="#f89820">## Tech Stack</text>
      <text x="92" y="205" font-size="22">☕ Java</text><text x="92" y="245" font-size="22">🐍 Python</text>
      <text x="92" y="285" font-size="22">🐘 PostgreSQL</text><text x="92" y="325" font-size="22">🐙 Git &amp; GitHub</text><text x="92" y="365" font-size="22">🌐 JS</text>
    </g>
    <g clip-path="url(#learnClip)">
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / learning</text>
      <text x="92" y="145" font-size="28" fill="#f89820">## Currently Learning</text>
      <text x="92" y="205" font-size="22">- Java Core</text><text x="92" y="250" font-size="22">- Object-Oriented Programming</text>
      <text x="92" y="295" font-size="22">- SQL &amp; PostgreSQL</text><text x="92" y="340" font-size="22">- Backend Development</text>
    </g>
    <g clip-path="url(#projectsClip)">
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / projects</text>
      <text x="92" y="145" font-size="28" fill="#f89820">## Projects</text>
      <text x="92" y="205" font-size="22">I build educational and personal projects</text>
      <text x="92" y="250" font-size="22">to practice programming and explore</text><text x="92" y="295" font-size="22">new technologies.</text>
    </g>
    <g clip-path="url(#goalsClip)">
      <text x="92" y="82" fill="#718198" font-size="14">era.profile / goals</text>
      <text x="92" y="145" font-size="28" fill="#f89820">## Goals</text>
      <text x="92" y="215" font-size="22">Become a strong Java Backend Developer</text>
      <text x="92" y="260" font-size="22">and continuously grow as a software engineer.</text>
      <text x="92" y="335" font-size="22" fill="#f89820">Always learning. Always building.</text>
    </g>
  </g>

  <g fill="#f89820">
    <rect x="92" y="315" width="10" height="25" rx="2">
      <animate attributeName="x" values="92;1030;1030;92" keyTimes="0;.2;.27;.32" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="315;315;315;315" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.2;.27;.32" dur="25s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="365" width="10" height="25" rx="2">
      <animate attributeName="x" values="92;500;500;92" keyTimes="0;.2;.27;.32" dur="25s" begin="6.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.2;.27;.32" dur="25s" begin="6.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="340" width="10" height="25" rx="2">
      <animate attributeName="x" values="92;650;650;92" keyTimes="0;.2;.27;.32" dur="25s" begin="10.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.2;.27;.32" dur="25s" begin="10.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="295" width="10" height="25" rx="2">
      <animate attributeName="x" values="92;620;620;92" keyTimes="0;.2;.27;.32" dur="25s" begin="14.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.2;.27;.32" dur="25s" begin="14.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="335" width="10" height="25" rx="2">
      <animate attributeName="x" values="92;850;850;92" keyTimes="0;.2;.27;.32" dur="25s" begin="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.2;.27;.32" dur="25s" begin="19s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
